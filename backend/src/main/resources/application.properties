server.port=${PORT:8080}

# PostgreSQL Database (Reads environment variables provided by Render, falls back to local if blank)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pdf-converter_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Automatically update tables from the Java entities (This will fix your column lengths on startup!)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File upload limits
spring.servlet.multipart.max-file-size=35MB
spring.servlet.multipart.max-request-size=35MB

# Storage directories
app.storage.temp-dir=./storage/temp
app.storage.upload-dir=./storage/uploads

# CORS - allow your live Vercel frontend URL
app.cors.allowed-origin=*