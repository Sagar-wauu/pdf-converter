# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# PostgreSQL Database
# Update these 3 values to match your local Postgres setup
# ==============================
spring.datasource.url=jdbc:postgresql://localhost:5432/pdf-converter_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Auto-create/update tables from the Java entities (fine for development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.web.resources.static-locations=classpath:/static/

# ==============================
# File upload limits (30 MB should cover most Word/PPT/PDF files)
# ==============================
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# ==============================
# Where converted/temp files are stored on the server before download
# ==============================
app.storage.temp-dir=./storage/temp
app.storage.upload-dir=./storage/uploads

# Path to the LibreOffice executable used for DOCX/PPTX <-> PDF conversion.
libreoffice.binary-path=C:/Program Files/LibreOffice/program/soffice.exe

# ==============================
# CORS - allow the React dev server to call this API
# ==============================
app.cors.allowed-origin=http://localhost:5173
